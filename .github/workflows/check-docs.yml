name: check-docs

# Builds the V2 docs on their own (services/site/src/docs/script/build.ts): compiles every MDX page,
# prerenders it, builds search, checks every link and that pages load nothing from outside /docs. The
# site's deploy runs the same step, so a broken page fails here instead of blocking the deploy.
#
# Trigger decision (#2677, 2026-11-24): dispatch-only, deliberately. Upstream triggers this on
# pull_request (paths-gated); the 2026-11-22 sync dropped that trigger and it is NOT restored -
# this fork forbids PR triggers (PR #1401, gate #1406) and runs validation by dispatch or
# schedule only (PR #1635; .github/ci-policy.md). Upstream has no push trigger to lose. The full
# docs build runs on workflow_dispatch; the job's draft guard and PR-number concurrency key are
# inert leftovers of the upstream PR shape, kept so the next sync diff stays small.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/site
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      # The API reference and the config schema the pages link (/docs/openapi.json, /v2/cli.json).
      - name: Generate
        run: bun run generate

      - name: Build docs
        run: bun src/docs/script/build.ts --out "$RUNNER_TEMP/docs"
