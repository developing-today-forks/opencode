name: nix-hashes
# RUNNER-SWITCH (2026-10-18): runners in this workflow were switched from Blacksmith to
# GitHub-hosted at Drew's direction. To switch back, grep the repo for RUNNER-SWITCH and
# swap each commented Blacksmith line back in for the active line under it. To choose per
# run instead, use an expression on runs-on, e.g. ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }},
# or gate individual steps with if: on the runner.

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
      - "services/*/package.json"
      - "flake.lock"
      - "nix/node_modules.nix"
      - "nix/scripts/**"
      - "patches/**"
      - ".github/workflows/nix-hashes.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a restamp run (#1580): with cancel-in-progress: true each new
  # merge killed the previous run before it could restamp, so the FOD hash
  # rotted silently. Queue runs instead; a failed run is visible in Actions
  # and a changed hash lands as the update-hashes commit below.
  cancel-in-progress: false

jobs:
  # Native runners required: bun install cross-compilation flags (--os/--cpu)
  # do not produce byte-identical node_modules as native installs.
  compute-hash:
    timeout-minutes: 20
    # #1871: only the aarch64-darwin leg is masked. When its runner never
    # starts, the leg is cancelled with zero steps and no step-level retry
    # can run; masking just this leg lets compute-hash-darwin-fallback
    # (below) recover at the workflow level. If the fallback also fails,
    # the run still fails visibly. Linux legs keep failing the job as before.
    continue-on-error: ${{ matrix.system == 'aarch64-darwin' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runner: blacksmith-4vcpu-ubuntu-2404
            runner: ubuntu-24.04
          - system: aarch64-linux
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runner: blacksmith-4vcpu-ubuntu-2404-arm
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Compute node_modules hash
        id: hash
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          BUILD_LOG=$(mktemp)
          trap 'rm -f "$BUILD_LOG"' EXIT

          HASH=""
          MAX_ATTEMPTS=3
          for ((ATTEMPT = 1; ATTEMPT <= MAX_ATTEMPTS; ATTEMPT++)); do
            # Build with fakeHash to trigger hash mismatch and reveal correct hash
            nix build ".#packages.${SYSTEM}.node_modules_updater" --no-link 2>&1 | tee "$BUILD_LOG" || true

            HASH="$(nix run --inputs-from . nixpkgs#gnugrep -- -oP 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' "$BUILD_LOG" | tail -n1 || true)"

            [ -n "$HASH" ] && break

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Attempt ${ATTEMPT}/${MAX_ATTEMPTS} produced no hash for ${SYSTEM}; retrying in $((ATTEMPT * 10))s"
              sleep $((ATTEMPT * 10))
            fi
          done

          if [ -z "$HASH" ]; then
            echo "::error::Failed to compute hash for ${SYSTEM} after ${MAX_ATTEMPTS} attempts"
            cat "$BUILD_LOG"
            exit 1
          fi

          echo "$HASH" > hash.txt
          echo "Computed hash for ${SYSTEM}: $HASH"

      - name: Upload hash
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hash-${{ matrix.system }}
          path: hash.txt
          retention-days: 1

  # #1871 fallback: run 42263623640 failed when the aarch64-darwin leg was
  # cancelled with zero steps - the macos-latest runner never started.
  # Recovery is workflow-level and bounded: exactly one recompute, on the
  # alternate macos-15 runner pool, and only when the primary leg left no
  # hash artifact.
  # #2539: a cancelled needs-job skips dependents under the default
  # success() gate, so without `if: always()` the fallback never engaged.
  # #2544: run 43911677987 failed all-green because the always-engaged
  # fallback queued ~15 min on macos-15 and was cancelled with zero steps
  # by the platform (macOS arm64 acquisition failure - runner never
  # assigned, under the 20 min job timeout, no competing run,
  # cancel-in-progress is false). Run 43924963639 then proved that
  # `continue-on-error: true` (#2547) does NOT save that case: it only
  # converts step failure, not platform cancellation, and the cancelled
  # no-op job still failed the run. So the no-op must never occupy a
  # macos runner in the first place: the artifact check below runs on
  # ubuntu (plentiful runners), and the macos-15 compute only starts when
  # the primary hash is actually missing. A narrower `== 'cancelled'`
  # fallback gate was also tried and proven dead: in runs 43920489996
  # and 43923958538 the darwin leg was platform-cancelled yet the narrow
  # fallback SKIPPED both times, so no recovery was possible. Key on the
  # artifact (ground truth), not on the matrix result (masked).
  fallback-decide:
    timeout-minutes: 5
    needs: compute-hash
    if: always() && needs.compute-hash.result != 'skipped'
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.decide.outputs.needed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check for the primary darwin hash artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hash-aarch64-darwin
          path: primary-hash

      - name: Decide whether the fallback compute is needed
        id: decide
        run: |
          if [ -s primary-hash/hash.txt ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Primary aarch64-darwin leg produced its hash; fallback compute not needed."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Primary aarch64-darwin leg produced no hash artifact; computing it on macos-15 (see #1871)."
          fi

  compute-hash-darwin-fallback:
    timeout-minutes: 20
    needs: [compute-hash, fallback-decide]
    # Run ONLY when the primary hash is actually missing: on the all-green
    # path this job skips and no macos runner is ever queued, so a
    # platform acquisition failure cannot fail the run (#2544).
    if: always() && needs.fallback-decide.outputs.needed == 'true'
    # continue-on-error converts a *step* failure to success so the run
    # still fails visibly downstream (update-hashes errors loudly on the
    # absent artifact per #79130df612) instead of skipping silently. It
    # does NOT cover platform cancellation: a cancelled job still fails
    # the run, which is correct here - the hash is genuinely missing.
    continue-on-error: true
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Compute node_modules hash (aarch64-darwin fallback)
        env:
          SYSTEM: aarch64-darwin
        run: |
          set -euo pipefail

          BUILD_LOG=$(mktemp)
          trap 'rm -f "$BUILD_LOG"' EXIT

          HASH=""
          MAX_ATTEMPTS=3
          for ((ATTEMPT = 1; ATTEMPT <= MAX_ATTEMPTS; ATTEMPT++)); do
            # Build with fakeHash to trigger hash mismatch and reveal correct hash
            nix build ".#packages.${SYSTEM}.node_modules_updater" --no-link 2>&1 | tee "$BUILD_LOG" || true

            HASH="$(nix run --inputs-from . nixpkgs#gnugrep -- -oP 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' "$BUILD_LOG" | tail -n1 || true)"

            [ -n "$HASH" ] && break

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Attempt ${ATTEMPT}/${MAX_ATTEMPTS} produced no hash for ${SYSTEM}; retrying in $((ATTEMPT * 10))s"
              sleep $((ATTEMPT * 10))
            fi
          done

          if [ -z "$HASH" ]; then
            echo "::error::Failed to compute hash for ${SYSTEM} after ${MAX_ATTEMPTS} attempts"
            cat "$BUILD_LOG"
            exit 1
          fi

          echo "$HASH" > hash.txt
          echo "Computed hash for ${SYSTEM}: $HASH"

      - name: Upload hash
        if: steps.decide.outputs.present == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hash-aarch64-darwin
          path: hash.txt
          retention-days: 1

  update-hashes:
    timeout-minutes: 15
    needs: [compute-hash, compute-hash-darwin-fallback]
    # #2539: when the darwin leg is cancelled, compute-hash result is
    # not 'success' and the default success() gate would skip the restamp even
    # though the fallback recovered the hash. Gate explicitly.
    # #2544: THIS gate (not the fallback's) carries the incident fix. Run
    # 43911677987 failed all-green because update-hashes required the
    # (no-op) fallback's success and the platform cancelled that no-op
    # job. So: proceed when compute-hash succeeded, whatever the fallback
    # did, or when the fallback recovered the hash. A 'failure' (a linux
    # leg failed) still blocks the restamp either way.
    if: >
      always() && github.event_name != 'pull_request'
      && needs.compute-hash.result != 'failure'
      && (needs.compute-hash.result == 'success'
        || needs.compute-hash-darwin-fallback.result == 'success')
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # The app token is preferred (its pushes trigger downstream workflows),
      # but on a repo where the app is not configured the token step fails
      # with "appId option is required" and the computed hashes are thrown
      # away — that is how the stale hashes in #175 survived a successful
      # compute-hash run. Fall back to GITHUB_TOKEN there: its pushes do not
      # trigger downstream workflows, which a hashes.json commit does not
      # need (this workflow's own paths do not include nix/hashes.json).
      - name: Setup git committer
        if: vars.OPENCODE_APP_ID != ''
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Setup git committer (fallback token)
        if: vars.OPENCODE_APP_ID == ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

      - name: Pull latest changes
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: Download hash artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: hashes
          pattern: hash-*

      - name: Update hashes.json
        run: |
          set -euo pipefail

          HASH_FILE="nix/hashes.json"

          [ -f "$HASH_FILE" ] || echo '{"nodeModules":{}}' > "$HASH_FILE"

          for SYSTEM in x86_64-linux aarch64-linux aarch64-darwin; do
            FILE="hashes/hash-${SYSTEM}/hash.txt"
            if [ -f "$FILE" ]; then
              HASH="$(tr -d '[:space:]' < "$FILE")"
              echo "${SYSTEM}: ${HASH}"
              jq --arg sys "$SYSTEM" --arg h "$HASH" '.nodeModules[$sys] = $h' "$HASH_FILE" > tmp.json
              mv tmp.json "$HASH_FILE"
            else
              # #2539 follow-up (CodeRabbit on #2540): the update-hashes gate
              # accepts a 'cancelled' compute-hash result, so a cancelled
              # linux leg must not silently commit a partial restamp.
              echo "::error::Missing hash for ${SYSTEM}; refusing to commit a partial restamp"
              exit 1
            fi
          done

          cat "$HASH_FILE"

      - name: Commit changes
        run: |
          set -euo pipefail

          HASH_FILE="nix/hashes.json"

          if [ -z "$(git status --short -- "$HASH_FILE")" ]; then
            echo "No changes to commit"
            echo "### Nix hashes" >> "$GITHUB_STEP_SUMMARY"
            echo "Status: no changes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add "$HASH_FILE"
          git commit -m "chore: update nix node_modules hashes"

          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

          echo "### Nix hashes" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: committed $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
