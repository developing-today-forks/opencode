name: test
# CI tier policy: .github/ci-policy.md (fast PR tier, full main tier).
# RUNNER-SWITCH (2026-10-18): runners in this workflow were switched from Blacksmith to
# GitHub-hosted at Drew's direction. To switch back, grep the repo for RUNNER-SWITCH and
# swap each commented Blacksmith line back in for the active line under it. To choose per
# run instead, use an expression on runs-on, e.g. ${{ vars.RUNNER_UBUNTU || 'ubuntu-24.04' }},
# or gate individual steps with if: on the runner.

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly backstop: the full main tier (build + e2e included) re-runs even
  # if no merge lands, so nothing removed from the PR tier can vanish.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  # Keep every run on main so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/main', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  affected:
    timeout-minutes: 15
    name: basic affected packages
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04
    outputs:
      # PR tier (ci-policy.md): e2e is a main-tier suite. It runs on pushes
      # to main, the nightly schedule and manual dispatches -- never on pull
      # requests. The aggregator job below treats a skipped e2e-suite as the
      # expected result whenever this output is false, so the branch-required
      # 'e2e (<os>)' check names still report (green) on PRs.
      e2e: ${{ steps.packages.outputs.app == 'true' && github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous main head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Find affected packages
        id: packages
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Storybook hosts the component tests, but no app package depends on it.
          bun x turbo@2.10.2 ls --affected --filter=@opencode/app --filter=@opencode/storybook --output=json > affected.json
          bun -e 'const result = await Bun.file("affected.json").json(); console.log(`app=${result.packages.count > 0}`)' >> "$GITHUB_OUTPUT"

  unit:
    timeout-minutes: 20
    name: basic unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): host: blacksmith-4vcpu-ubuntu-2404
            host: ubuntu-24.04
          - name: windows
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): host: blacksmith-4vcpu-windows-2025
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous main head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install ripgrep
        run: |
          # Unit tests drive a real rg binary (ripgrep, search tools) and
          # the test harness forbids RipgrepBinary's download fallback, so
          # unit cannot depend on whether the runner image ships one (#72).
          # Pin the same release src/ripgrep/binary.ts resolves: 15.1.0.
          version=15.1.0
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) platform="x86_64-unknown-linux-musl"; extension="tar.gz" ;;
            Linux-ARM64) platform="aarch64-unknown-linux-gnu"; extension="tar.gz" ;;
            Windows-X64) platform="x86_64-pc-windows-msvc"; extension="zip" ;;
            Windows-ARM64) platform="aarch64-pc-windows-msvc"; extension="zip" ;;
            *) echo "no ripgrep asset for runner ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/ripgrep-${version}-${platform}.${extension}"
          dest="${RUNNER_TEMP}/ripgrep-${version}"
          mkdir -p "$dest"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${version}/ripgrep-${version}-${platform}.${extension}" -o "$archive"
          if [ "$extension" = "zip" ]; then
            # Git's GNU tar cannot read zip; use the bsdtar in System32,
            # the same tool src/ripgrep/binary.ts extracts zips with.
            "/c/Windows/System32/tar.exe" -xf "$archive" -C "$dest"
          else
            tar -xzf "$archive" -C "$dest"
          fi
          bin_dir="$dest/ripgrep-${version}-${platform}"
          echo "$bin_dir" >> "$GITHUB_PATH"
          export PATH="$bin_dir:$PATH"
          rg --version

      - name: Test lint rules
        # The main ast-grep rules (script/ast-grep/rules) have their own
        # test suite (test:lint-rules) that nothing ran (#153); the
        # effect-simplification suite below was already wired up.
        if: runner.os == 'Linux'
        run: bun run test:lint-rules

      - name: Test Effect simplification rules
        if: runner.os == 'Linux'
        run: bun run test:effect-simplification-rules

      - name: Check Effect simplifications
        if: runner.os == 'Linux'
        run: bun run lint:effect-simplifications

      - name: Test mcpx-cleanup script
        # script/ is not a workspace, so turbo test never picks up
        # script/mcpx-cleanup.test.ts, and the root bunfig test root
        # deliberately blocks running tests from the repo root (#138).
        # Run the file explicitly from its own directory instead.
        working-directory: script
        run: bun test mcpx-cleanup.test.ts

      - name: Check turbo.json for duplicate keys
        # Turbo silently keeps the last definition of a repeated task key
        # (#145); the script-level test scans turbo.json duplicate-aware.
        # Same script/ wiring as the mcpx-cleanup step above.
        working-directory: script
        run: bun test turbo-json.test.ts

      - name: Test doc env var guard
        # Same script/ wiring as the mcpx-cleanup step above: script/ is
        # not a workspace, so the test file is run explicitly (#116).
        working-directory: script
        run: bun test check-doc-env-vars.test.ts

      - name: Check documented env vars have readers
        # Every OPENCODE_* variable cli.mdx documents must be read
        # somewhere outside the docs, or the row is a silent no-op (#116).
        if: runner.os == 'Linux'
        run: bun run check:doc-env-vars

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          # The runners have four vCPUs, and each Bun test process performs its own concurrent work.
          # A turbo/bun segfault (exit 139, SIGSEGV) truncates the suite and would read as an ordinary
          # test failure (#90), so both variants go through script/run-unit-tests.sh: it retries a crash
          # once and annotates a recurrence distinctly with the turbo and bun versions. Ordinary test
          # failures still pass straight through, unrepeated.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            GITHUB_ACTIONS=false bash script/run-unit-tests.sh bun turbo test --concurrency=3
            exit 0
          fi
          GITHUB_ACTIONS=false bash script/run-unit-tests.sh bun turbo test --affected --concurrency=3
        env:
          OPENCODE_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Verify published codemode package
        if: runner.os == 'Linux'
        working-directory: packages/codemode
        run: bun run script/publish.ts --dry-run

      - name: Verify packed workerd SDK
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            bun turbo verify:package --filter=@opencode/sdk
            exit 0
          fi
          bun turbo verify:package --affected --filter=@opencode/sdk
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated documentation
        if: runner.os == 'Linux'
        working-directory: services/www
        run: bun run check:generated

  build:
    # Main tier only (ci-policy.md): PRs get affected + unit; build runs on
    # push to main, nightly schedule and manual dispatch.
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    name: build (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): host: blacksmith-4vcpu-ubuntu-2404
            host: ubuntu-24.04
          - name: windows
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): host: blacksmith-4vcpu-windows-2025
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests diff against the merge's first parent; pushes diff against the previous main head.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify compiled service lifecycle
        timeout-minutes: 10
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      # Unit tests import workspace sources and never build the libraries they use, so this checks those builds. The
      # CLI and app closures hold every library a tested package depends on. The builds are tsc and Bun.build with no
      # platform-specific steps, and the libraries publish from Linux, so Windows skips them.
      - name: Build workspace libraries
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        timeout-minutes: 10
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            bun turbo build --concurrency=3 --filter='@opencode/cli^...' --filter='@opencode/app^...'
            exit 0
          fi
          bun turbo build --affected --concurrency=3 --filter='@opencode/cli^...' --filter='@opencode/app^...'
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Setup Node build runtime
        if: ${{ !cancelled() }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Verify Node build
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build-node.ts --single --skip-install --outdir=dist/node
          bun run script/service-smoke.ts --node

  e2e-suite:
    timeout-minutes: 30
    name: e2e (${{ matrix.settings.name }}, ${{ matrix.suite.id }})
    needs: affected
    if: needs.affected.outputs.e2e == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): host: blacksmith-4vcpu-ubuntu-2404
            host: ubuntu-24.04
          - name: windows
            # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): host: blacksmith-4vcpu-windows-2025
            host: windows-2025
        # Playwright splits whole spec files across shards by test count, not duration. Every app-N
        # entry must use the same total, and the entries must cover 1..total. The service worker suite
        # reuses shard 2's production build. Each component suite runs once per OS in its own leg, so the
        # two suites' Storybook servers and test time are not added up on one runner.
        suite:
          - id: app-1
            shard: 1/2
          - id: app-2
            shard: 2/2
          - id: session-ui-components
          - id: app-components
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests against production build
        if: matrix.suite.shard
        run: bun --cwd packages/app test:e2e:built --shard=${{ matrix.suite.shard }}
        env:
          CI: true
        timeout-minutes: 15

      - name: Verify service worker precaching and upgrades
        if: matrix.suite.shard == '2/2'
        working-directory: packages/app
        run: bunx playwright test --config e2e/service-worker/playwright.config.ts
        timeout-minutes: 5

      - name: Run session UI component tests
        if: matrix.suite.id == 'session-ui-components'
        run: bun --cwd packages/session-ui test:components
        env:
          CI: true
        timeout-minutes: 15

      - name: Run app component tests
        if: matrix.suite.id == 'app-components'
        run: bun --cwd packages/app test:components
        env:
          CI: true
        timeout-minutes: 15

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ matrix.suite.id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
            packages/session-ui/component-tests/test-results
            packages/session-ui/component-tests/playwright-report
            packages/app/component-tests/test-results
            packages/app/component-tests/playwright-report

  # Branch rules require one e2e check per OS. These keep those names and pass only when every
  # leg above passed, or when no leg was needed; a failing leg on either OS fails both checks.
  e2e:
    timeout-minutes: 20
    name: e2e (${{ matrix.os }})
    needs: [affected, e2e-suite]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
    # RUNNER-SWITCH: Blacksmith (commented out 2026-10-18): runs-on: blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-24.04
    steps:
      - name: Check browser test results
        env:
          AFFECTED: ${{ needs.affected.result }}
          SUITES: ${{ needs.e2e-suite.result }}
          EXPECTED: ${{ needs.affected.outputs.e2e == 'true' && 'success' || 'skipped' }}
        run: |
          echo "affected packages: $AFFECTED, browser test legs: $SUITES (expected $EXPECTED)"
          test "$AFFECTED" = success && test "$SUITES" = "$EXPECTED"
